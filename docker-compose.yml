services:
  postgres:                 # Nombre del servicio
    image: postgres:18      # PostgreSQL 18, trae psql
    environment:            # Usuario, contrasena y base de datos, tomados del .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro   # Con el volumen vacio ejecuta db/01_ a 03_, en orden
      - ./tests.sql:/tests.sql:ro             # Para correr las pruebas con psql
      - datos:/var/lib/postgresql             # Guarda los datos fuera del contenedor

  kafka:                    # El broker de Kafka. Sin ports: solo lo usan otros contenedores
    image: apache/kafka:4.1.0                                   # Imagen oficial de Kafka 4.1
    environment:            # Un broker que trabaja solo, en modo KRaft (sin ZooKeeper)
      KAFKA_NODE_ID: 1                                          # Identificador de este broker
      KAFKA_PROCESS_ROLES: broker,controller                    # Guarda mensajes y se coordina a si mismo
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093     # 9092 para los programas, 9093 para coordinarse
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092        # La direccion que se les da a los programas
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER               # Cual puerto es el de coordinacion
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT  # Sin cifrado ni contrasena
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093          # Quien coordina: este mismo broker
      KAFKA_NUM_PARTITIONS: 1                                   # Los topicos nuevos tienen una particion
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1                 # Una copia del topico interno de offsets
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1         # Una copia del topico interno de transacciones
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1                    # Basta una copia al dia para escribir en el
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1 # Una copia del topico interno de share groups
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1            # Basta una copia al dia para escribir en el
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0                 # El consumer empieza a leer sin esperar 3 s
      # Agregada (no viene en el PDF): el timestamp de cada mensaje es la hora en que llego al broker
      # (LogAppendTime), no la que pone el productor (CreateTime). La regla de duplicados se mide por
      # la llegada a Kafka, y asi no depende del reloj de cada productor.
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime

  producer:                 # La app simulada: publica reproducciones en Kafka
    build: .                # Construye la imagen con el Dockerfile de esta carpeta
    command: ["/app/.venv/bin/python", "app_simulator/producer.py"]
    environment:            # Las variables que el programa lee con os.environ
      POSTGRES_HOST: postgres                 # PostgreSQL, por el nombre de su servicio
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092     # Kafka, por el nombre de su servicio
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS}
      SKIP_RATE: ${SKIP_RATE}
      DUPLICATE_RATE: ${DUPLICATE_RATE}
      MAX_DUPLICATE_DELAY_SECONDS: ${MAX_DUPLICATE_DELAY_SECONDS}
      MAX_PLAY_AGE_DAYS: ${MAX_PLAY_AGE_DAYS}
    volumes:
      - enviados:/app/sent  # sent.log: los originales enviados, la referencia de verify.py
      - logs:/app/logs
    depends_on: [postgres, kafka]   # Se inicia despues, pero no espera a que esten listos
    restart: on-failure             # Si termina con error, Docker lo vuelve a iniciar

  consumer:                 # Lee los mensajes de Kafka y los guarda en el crudo
    build: .
    command: ["/app/.venv/bin/python", "ingestion/consumer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
    volumes:
      - crudo:/app/data     # Donde escribe el crudo; el processor ve el mismo volumen
      - logs:/app/logs
    depends_on: [kafka]
    restart: on-failure

  processor:                # cron ejecuta aqui el processor segun ingestion/crontab
    build: .
    # Copia las variables a /etc/environment, para que cron las vea, e inicia cron en primer plano
    command: ["sh", "-c", "printenv | grep -E '^(POSTGRES|KAFKA)_' > /etc/environment && cron -f"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_TOPIC: ${KAFKA_TOPIC}           # Que carpeta del crudo procesa
    volumes:
      - crudo:/app/data     # El mismo crudo que escribe el consumer
      - logs:/app/logs
      - enviados:/app/sent:ro   # Solo lo lee verify.py, que se ejecuta en este contenedor
    depends_on: [postgres]

volumes:                    # Docker los conserva hasta docker compose down -v
  datos:                    # Los datos de PostgreSQL
  crudo:                    # El crudo
  logs:                     # Los logs de los programas
  enviados:                 # sent.log del producer
